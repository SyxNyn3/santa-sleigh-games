name: Build WebGL

# Builds the North Pole Rush WebGL player in the cloud with GameCI's
# prebuilt Unity Docker image — no local Unity install required.
#
# IMPORTANT: this workflow is MANUAL-ONLY (workflow_dispatch). It will not
# run on push until we decide how to handle Unity licensing.
#
# Licensing options:
#   A) Add repo secret UNITY_LICENSE (contents of Unity_lic.ulf) and run
#      this workflow manually. .ulf = free Unity Personal activation file
#      (Unity Hub → Preferences → Licenses → Add). GitHub secrets are
#      encrypted and write-only — but it's still your call whether to put
#      it there.
#   B) Build locally once Unity is installed (MacBook revival or this PC)
#      and deploy the WebGL output to GitHub Pages / itch.io manually.
#   C) Self-hosted runner on hardware you control.
#
# To enable: uncomment the push trigger below AND add the UNITY_LICENSE
# secret (repo → Settings → Secrets and variables → Actions).

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          # Only needed if we go with option A — leave unset otherwise.
          # UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: WebGL
          unityVersion: 2022.3.41f1
          buildName: NorthPoleRush

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # unity-builder emits the player to build/<Platform>/
          path: build/WebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
